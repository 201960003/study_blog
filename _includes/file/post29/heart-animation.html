<style>
  .main-container {
    position: relative;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding: 30px 20px;
    background: linear-gradient(145deg, #1f1c2c, #000000);
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    font-family: 'Inter', -apple-system, sans-serif;
  }

  .canvas-container {
    position: relative;
    width: 100%;
    max-width: 800px;
    height: 60vh;
    min-height: 400px;
    background: radial-gradient(circle at 50% 50%, rgba(40, 10, 30, 0.5), rgba(0, 0, 0, 0.8));
    border-radius: 16px;
    overflow: hidden;
    box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .canvas-container::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 250px;
    height: 250px;
    background: radial-gradient(circle at 50% 50%, rgba(255, 20, 147, 0.2), transparent 70%);
    border-radius: 50%;
    z-index: 0;
    animation: pulse 3s ease-in-out infinite;
  }

  .canvas-container::after {
    content: '♥';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 150px;
    color: rgba(255, 20, 147, 0.15);
    text-shadow:
      0 0 20px rgba(255, 20, 147, 0.4),
      0 0 40px rgba(255, 20, 147, 0.2);
    z-index: 0;
    animation: glow 2s ease-in-out infinite alternate;
    pointer-events: none;
  }

  @keyframes pulse {

    0%,
    100% {
      opacity: 0.3;
      transform: translate(-50%, -50%) scale(1);
    }

    50% {
      opacity: 0.5;
      transform: translate(-50%, -50%) scale(1.1);
    }
  }

  @keyframes glow {
    0% {
      opacity: 0.2;
      text-shadow: 0 0 20px rgba(255, 20, 147, 0.4);
    }

    100% {
      opacity: 0.5;
      text-shadow: 0 0 40px rgba(255, 20, 147, 0.6);
    }
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    position: relative;
    z-index: 1;
    cursor: grab;
  }

  canvas:active {
    cursor: grabbing;
  }

  .controls-panel {
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }

  .controls-title {
    color: #ffb6c1;
    font-size: 1.1rem;
    font-weight: 600;
    text-align: center;
    margin-top: 0;
    margin-bottom: 8px;
    letter-spacing: 1px;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
  }

  .slider-group {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    width: 100%;
  }

  .slider-label {
    min-width: 45px;
    font-size: 0.95rem;
    font-weight: 600;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
  }

  .slider {
    -webkit-appearance: none;
    appearance: none;
    flex-grow: 1;
    height: 6px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 4px;
    outline: none;
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
    transition: background 0.3s;
  }

  .slider:hover {
    background: rgba(255, 255, 255, 0.2);
  }

  .slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff6b9d, #ff3366);
    cursor: pointer;
    box-shadow: 0 0 10px rgba(255, 51, 102, 0.5), 0 2px 5px rgba(0, 0, 0, 0.3);
    border: 2px solid white;
    transition: transform 0.1s;
  }

  .slider::-webkit-slider-thumb:hover {
    transform: scale(1.15);
    box-shadow: 0 0 15px rgba(255, 51, 102, 0.8), 0 2px 5px rgba(0, 0, 0, 0.3);
  }

  .slider::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff6b9d, #ff3366);
    cursor: pointer;
    box-shadow: 0 0 10px rgba(255, 51, 102, 0.5), 0 2px 5px rgba(0, 0, 0, 0.3);
    border: 2px solid white;
    transition: transform 0.1s;
  }

  .slider::-moz-range-thumb:hover {
    transform: scale(1.15);
  }

  .slider-value {
    min-width: 55px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-family: monospace;
    font-size: 1rem;
    font-weight: bold;
    color: #ff6b9d;
    background: rgba(0, 0, 0, 0.3);
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid rgba(255, 51, 102, 0.2);
  }
</style>

<div class="main-container">
  <div class="canvas-container">
    <canvas id="heartCanvas"></canvas>
  </div>

  <div class="controls-panel">
    <div class="controls-title">✨ 3D 회전 제어 (Rotation Controls)</div>
    <div class="slider-group">
      <span class="slider-label">X 축</span>
      <input type="range" id="rotationXSlider" class="slider" min="0" max="360" value="0">
      <span class="slider-value" id="rotationXValue">0°</span>
    </div>
    <div class="slider-group">
      <span class="slider-label">Y 축</span>
      <input type="range" id="rotationYSlider" class="slider" min="0" max="360" value="0">
      <span class="slider-value" id="rotationYValue">0°</span>
    </div>
    <div class="slider-group">
      <span class="slider-label">Z 축</span>
      <input type="range" id="rotationZSlider" class="slider" min="0" max="360" value="0">
      <span class="slider-value" id="rotationZValue">0°</span>
    </div>
  </div>
</div>

<script src="{{ '/assets/js/post29/heart-animation.js' | relative_url }}"></script>
